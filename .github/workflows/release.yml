name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "Tag must look like v1.2.3 (got ${GITHUB_REF_NAME})" >&2
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Patch addon version
        run: |
          sed -i -E "s/^## Version: .*/## Version: ${VERSION}/" Quest2RareScanner.toc
          sed -i -E "s/HELP_TITLE = \"Quest2RareScanner [^\"]*\"/HELP_TITLE = \"Quest2RareScanner ${VERSION}\"/" Locale.lua

          grep -n "^## Version:" Quest2RareScanner.toc
          grep -n "HELP_TITLE" Locale.lua

      - name: Build addon zip
        run: |
          rm -rf build
          mkdir -p build/Quest2RareScanner
          cp Quest2RareScanner.toc Quest2RareScanner.lua Locale.lua Data.lua README.md LICENSE build/Quest2RareScanner/

          cd build
          zip -r "../Quest2RareScanner-${VERSION}.zip" Quest2RareScanner
          cd ..

          unzip -l "Quest2RareScanner-${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Quest2RareScanner ${{ github.ref_name }}
          files: Quest2RareScanner-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
